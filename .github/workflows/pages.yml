# Publishes the demo website on GitHub Pages:
#   /            -> demo/site            (reference demo site)
#   /agent-run/  -> demo/agent-run/site  (site generated by the agent, once the "Generate demo site" workflow has run)
name: Deploy demo site to Pages
on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Generate demo site with the agent"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r demo/site/. _site/
          if [ -d demo/agent-run/site ]; then mkdir -p _site/agent-run && cp -r demo/agent-run/site/. _site/agent-run/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
