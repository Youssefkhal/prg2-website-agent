# Publishes the demo website at / and the agent web interface at /ui/.
#   /     -> website/site (once the generator has run) or demo/site
#   /ui/  -> backend/public, the agent UI. It calls the NestJS backend configured in Model settings.
name: Deploy website to Pages
on:
  push:
    branches: [main]
    paths: ["demo/**", "website/**", "backend/public/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Generate the website with the agent"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site
          if [ -f website/site/index.html ]; then cp -r website/site/. _site/; else cp -r demo/site/. _site/; fi
          # Host the agent web interface at /ui/. It calls the NestJS backend set in Model settings.
          mkdir -p _site/ui
          cp -r backend/public/. _site/ui/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
