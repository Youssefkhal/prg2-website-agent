# Runs the real agent headless on the demo brief and commits the generated website to demo/agent-run/.
# Needs repository secrets: ANTHROPIC_API_KEY (or OPENAI_API_KEY + variable MODEL=openai:...),
# optionally COLAB_GPU_URL / COLAB_GPU_TOKEN for real images generated on the Colab T4.
name: Generate demo site with the agent
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: ${{ vars.MODEL || 'anthropic:claude-sonnet-4-6' }}
      COLAB_GPU_URL: ${{ secrets.COLAB_GPU_URL }}
      COLAB_GPU_TOKEN: ${{ secrets.COLAB_GPU_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run build
          node dist/cli/demo.js --brief ../demo/brief-prompt.md --images ../demo/inputs --out ../demo/agent-run --thread demo
      - uses: actions/upload-artifact@v4
        with:
          name: agent-run
          path: demo/agent-run
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/agent-run
          git commit -m "demo: website generated by the agent" || echo "nothing to commit"
          git push
