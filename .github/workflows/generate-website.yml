# Runs the real agent on the brief + attached image and commits the website it builds to website/.
# GitHub Pages then serves that website at the root of https://<user>.github.io/<repo>/.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_API_KEY      free key from https://aistudio.google.com/apikey  (or ANTHROPIC_API_KEY / OPENAI_API_KEY)
#   COLAB_GPU_URL       printed by colab/gpu_server.ipynb (the Colab T4 session must be running)
#   COLAB_GPU_TOKEN     printed by colab/gpu_server.ipynb
# Optional repository variable: MODEL (e.g. google-genai:gemini-flash-latest)
name: Generate the website with the agent
on:
  workflow_dispatch:
    inputs:
      allow_placeholder_images:
        description: "Continue without the Colab GPU (placeholder images instead of AI images)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: generate-website
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: ${{ vars.MODEL }}
      COLAB_GPU_URL: ${{ secrets.COLAB_GPU_URL }}
      COLAB_GPU_TOKEN: ${{ secrets.COLAB_GPU_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          if [ -z "$GOOGLE_API_KEY$ANTHROPIC_API_KEY$OPENAI_API_KEY" ]; then
            echo "::error::Add a GOOGLE_API_KEY (free), ANTHROPIC_API_KEY or OPENAI_API_KEY repository secret."; exit 1; fi
          if [ -n "$GOOGLE_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY$OPENAI_API_KEY" ]; then
            echo "MODEL_RPM=8" >> "$GITHUB_ENV"
            if [ -z "$MODEL" ]; then
              # Pick the newest stable "gemini-<version>-flash" model available to this key
              # (a versioned name is required: the LangChain Gemini connector enables image input by name prefix).
              NAME=$(python3 - <<'PY'
          import json, os, re, urllib.request
          url = "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=" + os.environ["GOOGLE_API_KEY"]
          models = json.load(urllib.request.urlopen(url)).get("models", [])
          flash, lite = [], []
          for m in models:
              name = m["name"].split("/")[-1]
              if "generateContent" not in m.get("supportedGenerationMethods", []):
                  continue
              hit = re.fullmatch(r"gemini-(\d+(?:\.\d+)?)-flash(-lite)?", name)
              if hit:
                  (lite if hit.group(2) else flash).append((float(hit.group(1)), name))
          ordered = [n for _, n in sorted(flash, reverse=True)] + [n for _, n in sorted(lite, reverse=True)]
          print(" ".join(ordered or ["gemini-2.5-flash"]))
          PY
              )
              set -- $NAME
              echo "Using Gemini model: $1 (fallbacks: ${*:2})"
              echo "MODEL=google-genai:$1" >> "$GITHUB_ENV"
              FB=""; for m in "${@:2}"; do FB="$FB${FB:+,}google-genai:$m"; done
              echo "MODEL_FALLBACKS=$FB" >> "$GITHUB_ENV"
            fi
          fi
          if curl -sf --max-time 20 "${COLAB_GPU_URL%/}/health" && \
             curl -sf --max-time 60 -H "content-type: application/json" -H "x-api-key: $COLAB_GPU_TOKEN" \
               -d '{"texts":["test"],"kind":"query"}' "${COLAB_GPU_URL%/}/embed" > /dev/null; then
            echo; echo "Colab T4 GPU server is reachable and the token is valid."
          elif [ "${{ inputs.allow_placeholder_images }}" = "true" ]; then
            echo "::warning::Colab GPU not reachable: placeholder images will be used."; echo "COLAB_GPU_URL=" >> "$GITHUB_ENV"
          else
            echo "::error::Colab GPU server not reachable or token rejected. Start colab/gpu_server.ipynb on a T4 and copy the FULL printed values into the COLAB_GPU_URL / COLAB_GPU_TOKEN secrets."; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the agent
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run build
          node dist/cli/demo.js --brief ../demo/brief-prompt.md --images ../demo/inputs --out ../website --thread website 2>&1 | tee ../agent-run.log
          test -f ../website/site/index.html || { echo "::error::The agent did not produce site/index.html"; exit 1; }
          node -e 'const {auditSite}=require("./dist/tools/web-utils");const r=auditSite("../website/site");console.log("Audit:",r.summary);r.issues.forEach(i=>console.log(" -",i.severity,i.file,i.message))'
      - name: Save the run log
        if: always()
        run: mkdir -p website && cp agent-run.log website/agent-run.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website
          path: website
      - name: Commit the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          git commit -m "website: generated by the agent" || echo "nothing to commit"
          git push
